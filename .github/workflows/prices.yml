# Daily prices radar — GitHub Actions workflow
# PLACE THIS FILE AT: .github/workflows/prices.yml  (in the repo root)
# Cron times are UTC. Cairo is UTC+2 in winter (EET) and UTC+3 in summer (EEST):
#   winter: 07:00 UTC = 09:00 Cairo, 14:00 UTC = 16:00 Cairo
#   summer: 06:00 UTC = 09:00 Cairo, 13:00 UTC = 16:00 Cairo
# Adjust the cron in April/October when Egypt changes clocks (see README).
name: Daily prices radar

on:
  schedule:
    - cron: "0 7 * * *"    # 09:00 Cairo (winter)
    - cron: "0 14 * * *"   # 16:00 Cairo (winter)
  workflow_dispatch:
    inputs:
      force:
        description: "Force publish even on Friday/Saturday afternoon (bypasses the morning-only skip)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch + validate + update Blogger page
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          COINGECKO_DEMO_KEY: ${{ secrets.COINGECKO_DEMO_KEY }}
        run: |
          ARGS="--publish"
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python3 radar/fetch_prices.py $ARGS

      - name: Commit price archive
        run: |
          git config user.name "prices-radar"
          git config user.email "prices-radar@users.noreply.github.com"
          git add data/ pages/ || true
          git diff --cached --quiet || git commit -m "prices snapshot $(date -u +%Y-%m-%dT%H:%M)"
          git push || echo "nothing to push or push failed"
